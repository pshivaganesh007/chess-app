<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHESSVAULT</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chess.css">
</head>
<body>

<header>
  <div class="logo"><span class="logo-icon">♛</span> CHESSVAULT</div>
  <div class="header-actions">
    <button class="btn" id="flip-btn">Flip Board</button>
    <button class="btn primary" id="new-game-btn">New Game</button>
  </div>
</header>

<div class="app">
  <!-- Left Panel -->
  <aside class="panel">
    <div class="panel-title">Clocks</div>
    <div class="timer-block" id="timer-black">
      <div>
        <div class="timer-name">BLACK</div>
        <div class="timer-value" id="clock-black">10:00</div>
      </div>
      <span style="font-size:1.2rem; color:#444">♟</span>
    </div>
    <div class="timer-block active" id="timer-white">
      <div>
        <div class="timer-name">WHITE</div>
        <div class="timer-value" id="clock-white">10:00</div>
      </div>
      <span style="font-size:1.2rem; color:var(--gold)">♙</span>
    </div>

    <div style="margin-top:1.5rem">
      <div class="panel-title">Captured</div>
      <div class="captured-group">
        <div class="captured-label">By White</div>
        <div class="captured-pieces" id="cap-white"></div>
      </div>
      <div class="captured-group">
        <div class="captured-label">By Black</div>
        <div class="captured-pieces" id="cap-black"></div>
      </div>
    </div>
  </aside>

  <!-- Board -->
  <main class="board-wrap">
    <div class="status-bar" id="status-bar">White to move</div>
    <div style="position:relative; display:inline-block;">
      <div class="board-labels-left" id="rank-labels"></div>
      <div class="board-outer">
        <div id="board"></div>
      </div>
      <div class="board-labels-bottom" id="file-labels"></div>
    </div>
    <div class="board-controls">
      <button class="control-btn" id="prev-btn" title="Previous move">◀</button>
      <button class="control-btn" id="start-btn" title="Go to start">⏮</button>
      <button class="control-btn" id="end-btn" title="Go to end">⏭</button>
      <button class="control-btn" id="next-btn" title="Next move">▶</button>
    </div>
  </main>

  <!-- Right Panel -->
  <aside class="panel">
    <div class="panel-title">Move History</div>
    <div class="move-list" id="move-list"></div>
    <div style="margin-top:1.5rem">
      <div class="panel-title">Settings</div>
      <div style="display:flex;flex-direction:column;gap:0.6rem;">
        <label style="font-size:0.7rem;color:#7a6a50;cursor:pointer;display:flex;align-items:center;gap:0.5rem;">
          <input type="checkbox" id="show-legal" checked style="accent-color:var(--gold)"> Show legal moves
        </label>
        <label style="font-size:0.7rem;color:#7a6a50;cursor:pointer;display:flex;align-items:center;gap:0.5rem;">
          <input type="checkbox" id="show-last" checked style="accent-color:var(--gold)"> Highlight last move
        </label>
        <label style="font-size:0.7rem;color:#7a6a50;cursor:pointer;display:flex;align-items:center;gap:0.5rem;">
          <input type="checkbox" id="auto-queen" style="accent-color:var(--gold)"> Auto-queen
        </label>
      </div>
    </div>
  </aside>
</div>

<!-- Promotion Modal -->
<div id="promo-modal">
  <div class="promo-box">
    <div class="promo-title">Promote Pawn</div>
    <div class="promo-choices" id="promo-choices"></div>
  </div>
</div>

<!-- Result Banner -->
<div id="result-banner">
  <div class="result-box">
    <div class="result-title" id="result-title">Checkmate!</div>
    <div class="result-sub" id="result-sub">White wins by checkmate</div>
    <button class="btn primary" onclick="newGame()">Play Again</button>
  </div>
</div>

<script src="chess.js"></script>
</body>
</html>
